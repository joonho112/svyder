<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 345" width="300" height="345">
  <defs>
    <linearGradient id="hexbg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57A2CE"/>
      <stop offset="0.55" stop-color="#3B7BB2"/>
      <stop offset="1" stop-color="#244A6E"/>
    </linearGradient>
    <filter id="soft3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#0E2740" flood-opacity="0.4"/>
    </filter>
  </defs>

  <path d="M150,5 L296,88.5 L296,257.5 L150,341 L4,257.5 L4,88.5 Z" fill="#1D466A"/>
  <path d="M150,17 L285,94.5 L285,251.5 L150,329 L15,251.5 L15,94.5 Z" fill="url(#hexbg3)"/>

  <!-- central grand-mean axis toward which group effects shrink -->
  <line x1="150" y1="86" x2="150" y2="238" stroke="#EAF4FB" stroke-width="2" stroke-dasharray="2 6" opacity="0.7"/>
  <text x="150" y="80" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#EAF4FB" opacity="0.9" font-style="italic">&#956;</text>

  <!-- group effects (dots) with shrinkage arrows toward the centre; a few survey-sensitive ones flagged (orange) -->
  <g stroke="#CFE6F6" stroke-width="2" opacity="0.65">
    <line x1="66"  y1="104" x2="120" y2="104"/>
    <line x1="234" y1="128" x2="180" y2="128"/>
    <line x1="58"  y1="152" x2="120" y2="152"/>
    <line x1="242" y1="176" x2="180" y2="176"/>
    <line x1="70"  y1="200" x2="120" y2="200"/>
    <line x1="230" y1="224" x2="180" y2="224"/>
  </g>
  <g stroke="#CFE6F6" stroke-width="2" fill="#CFE6F6" opacity="0.65">
    <polygon points="120,104 128,100 128,108"/>
    <polygon points="180,128 172,124 172,132"/>
    <polygon points="120,152 128,148 128,156"/>
    <polygon points="180,176 172,172 172,180"/>
    <polygon points="120,200 128,196 128,204"/>
    <polygon points="180,224 172,220 172,228"/>
  </g>
  <g filter="url(#soft3)">
    <circle cx="62"  cy="104" r="10" fill="#BEE0F4"/>
    <circle cx="238" cy="128" r="10" fill="#F4A259"/>
    <circle cx="54"  cy="152" r="10" fill="#F4A259"/>
    <circle cx="246" cy="176" r="10" fill="#BEE0F4"/>
    <circle cx="66"  cy="200" r="10" fill="#BEE0F4"/>
    <circle cx="234" cy="224" r="10" fill="#F4A259"/>
