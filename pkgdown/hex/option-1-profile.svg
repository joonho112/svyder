<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 345" width="300" height="345">
  <defs>
    <linearGradient id="hexbg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA6D2"/>
      <stop offset="0.55" stop-color="#3E86BE"/>
      <stop offset="1" stop-color="#28597F"/>
    </linearGradient>
    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#12324A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- border ring + gradient face -->
  <path d="M150,5 L296,88.5 L296,257.5 L150,341 L4,257.5 L4,88.5 Z" fill="#1E4E6E"/>
  <path d="M150,17 L285,94.5 L285,251.5 L150,329 L15,251.5 L15,94.5 Z" fill="url(#hexbg1)"/>

  <!-- DER = 1 reference line (dashed) -->
  <line x1="52" y1="176" x2="248" y2="176" stroke="#EAF4FB" stroke-width="2" stroke-dasharray="7 5" opacity="0.9"/>
  <text x="243" y="169" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#EAF4FB" opacity="0.92" font-style="italic">DER = 1</text>

  <!-- baseline -->
  <line x1="52" y1="250" x2="248" y2="250" stroke="#EAF4FB" stroke-width="1.4" opacity="0.55"/>

  <!-- profile bars: taller-than-line = flagged (orange), else retained (light blue) -->
  <g filter="url(#soft1)">
    <rect x="60"  y="206" width="17" height="44"  rx="2.5" fill="#BEE0F4"/>
    <rect x="83"  y="150" width="17" height="100" rx="2.5" fill="#F4A259"/>
    <rect x="106" y="224" width="17" height="26"  rx="2.5" fill="#BEE0F4"/>
    <rect x="129" y="132" width="17" height="118" rx="2.5" fill="#F4A259"/>
    <rect x="152" y="197" width="17" height="53"  rx="2.5" fill="#BEE0F4"/>
    <rect x="175" y="160" width="17" height="90"  rx="2.5" fill="#F4A259"/>
    <rect x="198" y="214" width="17" height="36"  rx="2.5" fill="#BEE0F4"/>
    <rect x="221" y="188" width="17" height="62"  rx="2.5" fill="#BEE0F4"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="292" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#FFFFFF">svyder</text>
  <text x="150" y="312" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.4" fill="#D7EAF7">DESIGN EFFECT RATIOS</text>
</svg>
